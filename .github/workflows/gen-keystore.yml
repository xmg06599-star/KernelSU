name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate fixed keystore
        run: |
          keytool -genkeypair -v -keystore key.jks -alias moe \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass moepass123 -keypass moepass123 \
            -dname "CN=Moe KernelSU, OU=Moe, O=Moe, L=Moe, ST=Moe, C=CN"
          base64 -w0 key.jks > key.b64
          echo "SIZE=$(stat -c %s key.jks)"
          echo "SHA256=$(sha256sum key.jks | cut -d' ' -f1)"
      - name: Upload keystore
        uses: actions/upload-artifact@v5
        with:
          name: moe-keystore
          path: key.jks
